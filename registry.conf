# Image registry accounts, sourced by update_docker.sh and copy_to_dockerhub.sh.
# Change these to publish from a fork.

# GitHub owner and repository; GHCR images live at
# ghcr.io/GITHUB_USER/GITHUB_REPO.
GITHUB_USER="reinauer"
GITHUB_REPO="container-amiga-gcc"

# Docker Hub images live at docker.io/DOCKERHUB_USER/DOCKERHUB_REPO.
DOCKERHUB_USER="stefanreinauer"
DOCKERHUB_REPO="amiga-gcc"

GHCR_REPOSITORY="ghcr.io/${GITHUB_USER}/${GITHUB_REPO}"
DOCKERHUB_REPOSITORY="docker.io/${DOCKERHUB_USER}/${DOCKERHUB_REPO}"

# The retired container-amigappc-gcc images.  copy_to_dockerhub.sh points
# its latest tag at the newest ppc-amigaos image.  Leave empty to skip.
DOCKERHUB_PPC_LEGACY_REPOSITORY="docker.io/${DOCKERHUB_USER}/amigappc-gcc"
