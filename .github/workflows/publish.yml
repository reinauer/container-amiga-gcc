name: Publish compiler images to GHCR

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve image repository
        id: image
        run: |
          echo "repository=${REGISTRY}/${GITHUB_REPOSITORY,,}" \
            >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish compiler images
        run: |
          ./update_docker.sh --no-skip \
            --repository "${{ steps.image.outputs.repository }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve published image digest
        id: digest
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
        run: |
          digest="$(
            docker buildx imagetools inspect \
              "${IMAGE_REPOSITORY}:latest" \
              --format '{{.Manifest.Digest}}'
          )"
          if [[ ! "$digest" =~ ^sha256:[[:xdigit:]]{64}$ ]]; then
            echo "Invalid image digest: $digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
