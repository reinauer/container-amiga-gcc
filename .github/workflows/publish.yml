name: Publish compiler images to GHCR

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Build GCC 16.2 from this AmigaPorts/m68k-amigaos-gcc release tag (such as v16.2-rc21) instead of the branches, also tagged 16.2-rc21, as the toolchain archives do
        required: false
        type: string
      build_date:
        description: Build date used in the dated tags (YYYYMMDD; defaults to today)
        required: false
        type: string
  push:
    branches:
      - main
    # Changes that don't go into the images don't rebuild them.
    paths-ignore:
      - "**.md"
      - .github/workflows/toolchain-archives.yml
      - copy_to_dockerhub.sh
      - install_release.sh
      - zprofile

# A newer push supersedes the images still being built for an older one.
# A run started by hand, which a release of the toolchain archives does, has
# a group of its own, so that pushes don't cancel it.
concurrency:
  group: publish-${{ inputs.release_tag || github.event_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve image repository
        id: image
        env:
          BUILD_DATE: ${{ inputs.build_date }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          echo "repository=${REGISTRY}/${GITHUB_REPOSITORY,,}" \
            >> "$GITHUB_OUTPUT"

          if [[ -n "$BUILD_DATE" && ! "$BUILD_DATE" =~ ^[0-9]{8}$ ]]; then
            echo "Invalid build date: $BUILD_DATE (expected YYYYMMDD)" >&2
            exit 1
          fi

          # Every run builds GCC 16.2, so the images are attested through
          # latest; a release's own tag, such as 16.2-rc21, is the same image.
          echo "tag=latest" >> "$GITHUB_OUTPUT"
          if [[ -n "$RELEASE_TAG" ]]; then
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+)*(-rc[0-9]+)?$ ]]; then
              echo "Invalid release tag: $RELEASE_TAG (expected such as v16.2-rc21)" >&2
              exit 1
            fi
            git ls-remote --exit-code --tags \
              https://github.com/AmigaPorts/m68k-amigaos-gcc \
              "refs/tags/$RELEASE_TAG" >/dev/null || {
              echo "No release tag $RELEASE_TAG in AmigaPorts/m68k-amigaos-gcc" >&2
              exit 1
            }
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish compiler images
        env:
          BUILD_DATE: ${{ inputs.build_date }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          args=(--no-skip --repository "$IMAGE_REPOSITORY")
          if [[ -n "$RELEASE_TAG" ]]; then
            args+=(--release-tag "$RELEASE_TAG")
          fi
          if [[ -n "$BUILD_DATE" ]]; then
            args+=(--date "$BUILD_DATE")
          fi
          ./update_docker.sh "${args[@]}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve published image digest
        id: digest
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          digest="$(
            docker buildx imagetools inspect \
              "${IMAGE_REPOSITORY}:${IMAGE_TAG}" \
              --format '{{.Manifest.Digest}}'
          )"
          if [[ ! "$digest" =~ ^sha256:[[:xdigit:]]{64}$ ]]; then
            echo "Invalid image digest: $digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
