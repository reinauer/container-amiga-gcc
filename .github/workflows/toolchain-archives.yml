name: Build native toolchain archives

on:
  workflow_dispatch:
    inputs:
      build_date:
        description: Build date used in install paths (YYYYMMDD; defaults to today)
        required: false
        type: string
      release:
        description: Publish the archives as a GitHub release
        required: false
        type: boolean
        default: true
      release_tag:
        description: Build GCC 16.2 from this AmigaPorts/m68k-amigaos-gcc release tag (such as v16.2-rc21) instead of the branches
        required: false
        type: string
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      build_date: ${{ steps.build-date.outputs.value }}
      release_tag: ${{ steps.release-tag.outputs.value }}

    steps:
      - name: Resolve build date
        id: build-date
        env:
          REQUESTED_BUILD_DATE: ${{ inputs.build_date }}
        run: |
          build_date="${REQUESTED_BUILD_DATE:-$(date -u +%Y%m%d)}"
          if [[ ! "$build_date" =~ ^[0-9]{8}$ ]]; then
            echo "Invalid build date: $build_date (expected YYYYMMDD)" >&2
            exit 1
          fi
          echo "value=$build_date" >> "$GITHUB_OUTPUT"

      # Check the tag here, before the builds start, rather than in each one.
      - name: Resolve release tag
        id: release-tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            if [[ ! "$RELEASE_TAG" =~ ^v16\.2(-rc[0-9]+)?$ ]]; then
              echo "Invalid release tag: $RELEASE_TAG (expected v16.2 or v16.2-rcN)" >&2
              exit 1
            fi
            git ls-remote --exit-code --tags \
              https://github.com/AmigaPorts/m68k-amigaos-gcc \
              "refs/tags/$RELEASE_TAG" >/dev/null || {
              echo "No release tag $RELEASE_TAG in AmigaPorts/m68k-amigaos-gcc" >&2
              exit 1
            }
          fi
          echo "value=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    name: ${{ matrix.archive_os }} ${{ matrix.toolchain.target }} GCC ${{ matrix.toolchain.version }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        os:
          - linux
          - macos
        # name is the prefix and archive base name.
        toolchain:
          - { target: m68k-amigaos, version: 6.5.0b, name: amiga }
          - { target: m68k-amigaos, version: "13.4", name: amiga }
          - { target: m68k-amigaos, version: "16.2", name: amiga }
          - { target: ppc-amigaos, version: "16.2", name: amiga-ppc }
        include:
          - os: linux
            runner: ubuntu-24.04
            archive_os: linux-x86_64
          - os: macos
            runner: macos-15
            archive_os: macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build toolchain
        id: build
        env:
          BUILD_DATE: ${{ needs.metadata.outputs.build_date }}
          GCC_VERSION: ${{ matrix.toolchain.version }}
          NAME: ${{ matrix.toolchain.name }}
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
          TARGET: ${{ matrix.toolchain.target }}
        run: |
          # A release tag pins GCC 16.2: every m68k-amigaos module is checked
          # out at its m68k-amigaos-gcc-TAG tag, and ppc-amigaos takes gcc
          # and binutils from the same tags.  Other versions use the branches.
          version_args=(--version "$GCC_VERSION")
          if [[ -n "$RELEASE_TAG" && "$GCC_VERSION" == "16.2" ]]; then
            if [[ "$TARGET" == "m68k-amigaos" ]]; then
              version_args+=(--release-tag "$RELEASE_TAG")
            else
              ref="m68k-amigaos-gcc-$RELEASE_TAG"
              version_args=(--version "$GCC_VERSION:$ref" --binutils-ref "$ref")
            fi
          fi
          ./build.sh \
            --target "$TARGET" \
            "${version_args[@]}" \
            --date "$BUILD_DATE" \
            --prefix-template "$NAME-{version}-{date}" \
            --workdir "$RUNNER_TEMP/$NAME-gcc-$GCC_VERSION"

      - name: Collect build failure diagnostics
        if: failure() && steps.build.outcome == 'failure'
        env:
          GCC_VERSION: ${{ matrix.toolchain.version }}
          NAME: ${{ matrix.toolchain.name }}
        run: |
          workdir="$RUNNER_TEMP/$NAME-gcc-$GCC_VERSION"
          diagnostics="$RUNNER_TEMP/build-diagnostics"
          mkdir -p "$diagnostics"

          # Record the actual checkouts: make update follows upstream branches.
          for repo in "$GITHUB_WORKSPACE" "$workdir"/* "$workdir"/*/projects/*; do
            if [[ -d "$repo/.git" ]]; then
              printf '\n%s\n' "$repo"
              git -C "$repo" rev-parse HEAD || true
              git -C "$repo" status --short || true
            fi
          done > "$diagnostics/source-revisions.txt"

          # Preserve directory names to distinguish multilib config logs.
          if [[ -d "$workdir" ]]; then
            while IFS= read -r -d '' file; do
              dest="$diagnostics/${file#"$workdir/"}"
              mkdir -p "$(dirname "$dest")"
              cp "$file" "$dest"
            done < <(find "$workdir" -type d -name .git -prune -o \
              -type f \( -name config.log -o -path '*/log/*.log' \
              -o -name .manifest -o -name .repos -o -name default-repos \) -print0)
          fi

      - name: Upload build failure diagnostics
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: build-diagnostics-${{ matrix.archive_os }}-${{ matrix.toolchain.name }}-gcc-${{ matrix.toolchain.version }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-diagnostics/
          include-hidden-files: true
          if-no-files-found: error

      - name: Create toolchain archive
        id: archive
        env:
          ARCHIVE_OS: ${{ matrix.archive_os }}
          BUILD_DATE: ${{ needs.metadata.outputs.build_date }}
          GCC_VERSION: ${{ matrix.toolchain.version }}
          NAME: ${{ matrix.toolchain.name }}
          TARGET: ${{ matrix.toolchain.target }}
        run: |
          prefix_name="$NAME-$GCC_VERSION-$BUILD_DATE"
          link_name="$NAME-$GCC_VERSION"
          archive="$RUNNER_TEMP/$NAME-gcc-$GCC_VERSION-$BUILD_DATE-$ARCHIVE_OS.tar.xz"

          # GCC build trees can consume most of a hosted runner's disk. They
          # are not part of the installed toolchain, so reclaim that space
          # before creating and verifying a second, extracted archive copy.
          rm -rf -- "$RUNNER_TEMP/$NAME-gcc-$GCC_VERSION"

          sudo ln -sfn "$prefix_name" "/opt/$link_name"
          sudo chown -R 0:0 "/opt/$prefix_name"
          sudo chown -h 0:0 "/opt/$link_name"

          COPYFILE_DISABLE=1 tar -C / -cJf "$archive" \
            "opt/$prefix_name" \
            "opt/$link_name"

          verify_dir="$RUNNER_TEMP/archive-check-$NAME-$GCC_VERSION"
          mkdir -p "$verify_dir"
          tar -C "$verify_dir" -xJf "$archive"
          test -x "$verify_dir/opt/$prefix_name/bin/$TARGET-gcc"
          test -L "$verify_dir/opt/$link_name"
          test "$(readlink "$verify_dir/opt/$link_name")" = "$prefix_name"

          echo "path=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload toolchain archive
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.archive.outputs.path }}
          archive: false
          if-no-files-found: error

  release:
    needs:
      - metadata
      - build
    # Pushes to main only keep the archives as run artifacts; releases are
    # cut deliberately from a manual run.
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Download toolchain archives
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          BUILD_DATE: ${{ needs.metadata.outputs.build_date }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
        run: |
          tag="v${BUILD_DATE:0:4}-${BUILD_DATE:4:2}-${BUILD_DATE:6:2}"
          archives=(dist/*.tar.xz)
          if [[ ! -e "${archives[0]}" ]]; then
            echo "No toolchain archives found" >&2
            exit 1
          fi

          # Say which release tag GCC 16.2 came from, if any, ahead of the
          # generated notes.
          notes="$(gh api "repos/${GH_REPO}/releases/generate-notes" \
            -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" --jq .body)"
          if [[ -n "$RELEASE_TAG" ]]; then
            notes="GCC 16.2 for m68k-amigaos and ppc-amigaos is built from [AmigaPorts/m68k-amigaos-gcc ${RELEASE_TAG}](https://github.com/AmigaPorts/m68k-amigaos-gcc/releases/tag/${RELEASE_TAG}); the other versions from their branches.

          ${notes}"
          fi

          # A second run for the same build date replaces that release's
          # archives and notes instead of failing on the existing tag.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${archives[@]}" --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" "${archives[@]}" \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --notes "$notes"
          fi
